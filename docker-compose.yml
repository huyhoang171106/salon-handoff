# Chỉ chạy PostgreSQL cho môi trường phát triển: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports:
      - "5432:5432"
    volumes:
      - salon-db:/var/lib/postgresql/data
volumes:
  salon-db:
